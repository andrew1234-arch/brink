name: Deploy dashboard to Hugging Face Space

# Builds the monitor dashboard and pushes it to a Hugging Face Space. All decisions live in
# scripts/deploy_space.py; this file only wires up triggers and configuration.
#
# Triggers:
#   - after CI passes on a push to main in this repository (workflow_run): new code is deployed only once it's
#     tested, and only while it is still the tip of main (a slow CI run on an older commit can't roll back)
#   - hourly (schedule): picks up new results on the `results/all` branch. That branch holds only results, so a
#     push to it can't trigger a workflow; the run does nothing if nothing changed.
#   - manually (workflow_dispatch)
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   secret   HF_TOKEN          a Hugging Face token with WRITE access
#   variable HF_SPACE_ID       e.g. your-hf-username/brink   (a secret of that name works too; without either the
#                              deploy step is skipped with a notice)
#   Without HF_TOKEN the deploy step is skipped with a notice.
#   variable HF_SPACE_PUBLIC   "true" for a public Space; anything else keeps it private (applied every deploy)
#   secret   HF_SPACE_TOKEN    optional READ token, installed as the Space's HF_TOKEN for live runs (gated datasets)

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read
  actions: read

# Automatic runs share one queue: a newer one may replace a queued one, which is fine because every run deploys
# the latest state. A manual run has its own queue so the hourly schedule can never replace it.
concurrency:
  group: deploy-space-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
  cancel-in-progress: false   # never interrupt an upload half-way

jobs:
  deploy:
    # workflow_run: only CI runs that succeeded for a push in this repository, never a fork's pull request.
    # (No check on HF_SPACE_ID here: it may be a variable or a secret, and secrets can't be read in a job `if`.
    # scripts/deploy_space.py skips the deploy with a notice when it's missing.)
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # After CI: deploy exactly the commit CI tested. Otherwise: main (the script confirms CI passed).
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install huggingface_hub

      - name: Deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID || secrets.HF_SPACE_ID }}
          HF_SPACE_PUBLIC: ${{ vars.HF_SPACE_PUBLIC }}
          DEPLOY_EVENT: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/deploy_space.py
