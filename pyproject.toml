[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brink-safety"
version = "0.1.0"
description = "Stop fine-tuning from breaking an LLM's safety: gate the data, watch refusal while it trains, roll back as soon as it slips."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Cmg" }]
keywords = ["ai-safety", "alignment", "fine-tuning", "llm", "interpretability", "refusal", "lora", "red-teaming"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.56",
    "peft>=0.13",
    "datasets>=2.20",
    "numpy",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
judge = ["bitsandbytes", "accelerate"]
curatorkit = ["curatorkit"]
safetune = ["safetune"]
auditkit = ["auditkit"]
dashboard = ["gradio==6.31.0", "plotly>=5"]
dev = ["pytest", "ruff"]

[project.scripts]
brink = "brink.cli:main"

[project.urls]
Repository = "https://github.com/andrew1234-arch/brink"

[tool.setuptools.packages.find]
include = ["brink*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]
ignore = [
    "B905",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF005",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E402"]
"tests/*" = ["E402"]
"app/*" = ["E402"]
"scripts/*" = ["E402"]
"notebooks/*" = ["F821", "E501", "SIM102", "SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["brink", "experiments", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:warnings"
