[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brink-safety"
version = "0.1.0"
description = "Detect and prevent LLM safety collapse during fine-tuning, before it happens."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Cmg" }]
keywords = ["ai-safety", "alignment", "fine-tuning", "llm", "interpretability", "refusal", "lora"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.56",
    "peft>=0.13",
    "datasets>=2.20",
    "numpy",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
judge = ["bitsandbytes", "accelerate"]          # WildGuard judge in 4-bit
curatorkit = ["curatorkit"]                       # BrinkSafetyGate inside CuratorKIT pipelines
safetune = ["safetune"]                           # post-hoc baselines (needs Python >= 3.12)
auditkit = ["auditkit"]                           # red-team probes
# AlignTune: install with `pip install --no-deps aligntune "trl==1.7.1" pypdf python-docx`
# (its PyICU dependency needs system ICU; see docs/UPSTREAM.md).
dashboard = ["gradio==6.31.0", "plotly>=5"]       # same pin as app/requirements.txt (tested)
dev = ["pytest", "ruff"]

[project.urls]
Repository = "https://github.com/andrew1234-arch/brink"

[tool.setuptools.packages.find]
include = ["brink*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]
ignore = [
    "B905",     # zip() without strict=: lengths are checked where it matters
    "RUF001",   # ×, – and other typographic characters in report strings are intentional
    "RUF002",
    "RUF003",
    "RUF005",   # list concatenation reads better than unpacking here
    "SIM105",   # explicit try/except/pass is clearer in the few places it's used
]

[tool.ruff.lint.per-file-ignores]
# Entry points add the repo root to sys.path before importing the package.
"experiments/*" = ["E402"]
"tests/*" = ["E402"]
"app/*" = ["E402"]
"scripts/*" = ["E402"]
# Kaggle notebooks: `_exit_code` comes from IPython's `!` magic; cells favour short, linear code.
"notebooks/*" = ["F821", "E501", "SIM102", "SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["brink", "experiments", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:warnings"
